AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 Instance with KeyPair for SSH access via Tera Term'

Parameters:
  MyIP:
    Type: String
    Description: 'Your Public IP address to allow SSH (e.g., 1.2.3.4/32)'
    Default: '125.196.132.192/32' # セキュリティのため自分のIPを指定することを推奨

Resources:
  # 1. ネットワーク周り
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: MyVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # 2. セキュリティグループ（SSH許可）
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access via port 22
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP

  # 3. キーペアの作成
  MyKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: MyNewEC2Key

  # 4. EC2インスタンス本体
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-08e9303749c08284d # 東京リージョンのAmazon Linux 2023 (適宜変更可)
      KeyName: !Ref MyKeyPair
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          SubnetId: !Ref PublicSubnet
          GroupSet: [!Ref InstanceSecurityGroup]

Outputs:
  PublicDNS:
    Description: Public DNS name of the EC2 instance
    Value: !GetAtt MyEC2Instance.PublicDnsName
  KeyPairID:
    Description: KeyPair ID for SSM lookup
    Value: !Ref MyKeyPair